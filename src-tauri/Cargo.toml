[package]
name = "ots-manager"
version = "0.1.0"
description = "OpenTimestamps Manager - batch create, upgrade and verify OTS proofs"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
sha1 = "0.10"
ripemd = "0.1"
sha3 = "0.10"
hex = "0.4"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
strip = true
